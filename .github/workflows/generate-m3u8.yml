name: Generate M3U8 from Release

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'GitHub Release の URL (例: https://github.com/uefn1/tmp-record2/releases/tag/rec-FIFA%2B-20261028-122)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release への .m3u8 のアップロードに必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 1ファイルずつ DL -> 秒数解析 -> キャッシュ削除
      - name: Run script to generate m3u8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_m3u8.py "${{ inputs.release_url }}"

      # URL からリポジトリとタグ名を抽出し、元の Release に .m3u8 を単体ファイルとしてアップロード
      - name: Upload .m3u8 directly to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # URL から repo (owner/repo) と tag を抽出
          RELEASE_URL="${{ inputs.release_url }}"
          REPO=$(echo "$RELEASE_URL" | sed -E 's|https?://github.com/([^/]+/[^/]+)/releases/tag/.*|\1|')
          RAW_TAG=$(echo "$RELEASE_URL" | sed -E 's|https?://github.com/[^/]+/[^/]+/releases/tag/([^/?#]+).*|\1|')
          
          # URLデコード (%2B -> + など)
          TAG=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote(sys.argv[1]))" "$RAW_TAG")

          echo "Target Repo: $REPO"
          echo "Target Tag: $TAG"

          # Releaseに .m3u8 を直接アタッチ (--clobber で同名があれば上書き)
          gh release upload "$TAG" playlist.m3u8 --repo "$REPO" --clobber

      # （念のためのバックアップとして Actions の Artifacts にも保存）
      - name: Upload m3u8 as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: playlist-m3u8
          path: playlist.m3u8
