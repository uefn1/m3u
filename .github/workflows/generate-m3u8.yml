name: Generate M3U8 from Release

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'GitHub Release の URL (例: https://github.com/uefn1/tmp-record2/releases/tag/rec-FIFA%2B-20261028-122)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Releaseの閲覧・ダウンロードに必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run script to generate m3u8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_m3u8.py "${{ inputs.release_url }}"

      - name: Upload m3u8 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-m3u8
          path: playlist.m3u8
