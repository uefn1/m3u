name: Generate M3U8 from Release

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'GitHub Release の URL (例: https://github.com/uefn1/files/releases/tag/mp4-rec-Tigo-20261028-720-20261028130840)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release 作成・アップロードに必須

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 1ファイルずつ DL -> 秒数解析 -> キャッシュ削除
      - name: Run script to generate m3u8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_m3u8.py "${{ inputs.release_url }}"

      # ファイルの存在を確認し、現在リポジトリの Release にアップロード
      - name: Upload .m3u8 to Current Repo Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE_PATH="${{ github.workspace }}/playlist.m3u8"
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "エラー: $FILE_PATH が見つかりません。"
            echo "カレントディレクトリ一覧:"
            ls -la
            exit 1
          fi

          RELEASE_URL="${{ inputs.release_url }}"
          RAW_TAG=$(echo "$RELEASE_URL" | sed -E 's|https?://github.com/[^/]+/[^/]+/releases/tag/([^/?#]+).*|\1|')
          TAG=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote(sys.argv[1]))" "$RAW_TAG")

          echo "Target Tag: $TAG"
          echo "Target Repo: ${{ github.repository }}"
          echo "File Path: $FILE_PATH"

          # 既存Releaseへのアップロードを試み、なければ新規作成
          gh release upload "$TAG" "$FILE_PATH" --repo "${{ github.repository }}" --clobber || \
          gh release create "$TAG" "$FILE_PATH" --repo "${{ github.repository }}" --title "$TAG" --notes "Generated M3U8 for $TAG"

      # バックアップ用 Artifact
      - name: Upload m3u8 as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: playlist-m3u8
          path: ${{ github.workspace }}/playlist.m3u8
