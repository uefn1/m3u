name: Generate M3U8 from Release

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'GitHub Release の URL (例: https://github.com/uefn1/files/releases/tag/mp4-rec-Tigo-20261028-720-20261028130840)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 実行元リポジトリへの Release 作成・アップロードに必須

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 1ファイルずつ DL -> 秒数解析 -> キャッシュ削除
      - name: Run script to generate m3u8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_m3u8.py "${{ inputs.release_url }}"

      # 実行元リポジトリ自身の Release に .m3u8 単体をアップロード（無ければ Release を自動作成）
      - name: Upload .m3u8 to Current Repo Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_URL="${{ inputs.release_url }}"
          RAW_TAG=$(echo "$RELEASE_URL" | sed -E 's|https?://github.com/[^/]+/[^/]+/releases/tag/([^/?#]+).*|\1|')
          TAG=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote(sys.argv[1]))" "$RAW_TAG")

          echo "Target Tag: $TAG"
          echo "Target Repo: ${{ github.repository }}"

          # 既に同名の Release があれば playlist.m3u8 を追加・上書きアップロード
          # 無ければ新規に Release を作成して playlist.m3u8 を添付
          gh release upload "$TAG" playlist.m3u8 --repo "${{ github.repository }}" --clobber || \
          gh release create "$TAG" playlist.m3u8 --repo "${{ github.repository }}" --title "$TAG" --notes "Generated M3U8 for $TAG"

      # バックアップとして Actions 側の Artifact にも保存（zip形式）
      - name: Upload m3u8 as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: playlist-m3u8
          path: playlist.m3u8
