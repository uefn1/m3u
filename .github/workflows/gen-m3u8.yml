name: Generate m3u8 from Release (Go embedded in yml)

on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'Release URL (例: https://github.com/uefn1/go-stream-capturer/releases/tag/rec-... )'
        required: true
        type: string
      output_name:
        description: '出力m3u8名'
        required: false
        default: 'playlist.m3u8'
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/gen-m3u8.yml'
  release:
    types: [published]

jobs:
  gen-m3u8:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Create Go files (embedded in yml)
        run: |
          cat << 'GOMOD' > go.mod
module m3u-gen

go 1.22

require gopkg.in/yaml.v3 v3.0.1

          GOMOD
          cat << 'GOMAIN' > main.go
package main

// m3u-gen - Release URLからVLCで通常バー表示されるVOD用.m3u8を生成
// 使い方:
//   単一URL: go run . -url https://github.com/OWNER/REPO/releases/tag/TAG -o playlist.m3u8
//   ymlから: go run . -config config.yml

import (
	"encoding/binary"
	"encoding/json"
	"flag"
	"fmt"
	"io"
	"net/http"
	"net/url"
	"os"
	"os/exec"
	"regexp"
	"sort"
	"strings"
	"sync"
	"time"

	"gopkg.in/yaml.v3"
)

type Asset struct {
	Name               string `json:"name"`
	BrowserDownloadURL string `json:"browser_download_url"`
	Size               int64  `json:"size"`
}
type Release struct {
	Assets []Asset `json:"assets"`
}

type Config struct {
	Releases []struct {
		URL    string `yaml:"url"`
		Output string `yaml:"output"`
	} `yaml:"releases"`
	Settings struct {
		Concurrency int  `yaml:"concurrency"`
		PreferMp4   bool `yaml:"prefer_mp4"`
	} `yaml:"settings"`
}

var (
	reTag = regexp.MustCompile(`github\.com/([^/]+)/([^/]+)/releases/(?:tag|download)/([^/?#]+)`)
	reDl  = regexp.MustCompile(`github\.com/([^/]+)/([^/]+)/releases/download/([^/?#]+)/`)
)

func parseURL(input string) (owner, repo, tag, base string, err error) {
	input = strings.TrimSpace(input)
	if m := reDl.FindStringSubmatch(input); m != nil {
		owner, repo = m[1], m[2]
		t, _ := url.PathUnescape(m[3])
		tag = t
		base = fmt.Sprintf("https://github.com/%s/%s/releases/download/%s/", owner, repo, url.PathEscape(tag))
		return
	}
	if m := reTag.FindStringSubmatch(input); m != nil {
		owner, repo = m[1], m[2]
		t, _ := url.PathUnescape(strings.Split(m[3], "/")[0])
		tag = t
		base = fmt.Sprintf("https://github.com/%s/%s/releases/download/%s/", owner, repo, url.PathEscape(tag))
		return
	}
	err = fmt.Errorf("URL解析失敗: %s", input)
	return
}

func fetchAssets(owner, repo, tag, token string) ([]Asset, error) {
	apiURL := fmt.Sprintf("https://api.github.com/repos/%s/%s/releases/tags/%s", owner, repo, url.PathEscape(tag))
	req, _ := http.NewRequest("GET", apiURL, nil)
	req.Header.Set("Accept", "application/vnd.github+json")
	if token != "" {
		req.Header.Set("Authorization", "Bearer "+token)
	}
	client := &http.Client{Timeout: 15 * time.Second}
	resp, err := client.Do(req)
	if err != nil {
		return nil, err
	}
	defer resp.Body.Close()
	if resp.StatusCode != 200 {
		body, _ := io.ReadAll(io.LimitReader(resp.Body, 500))
		return nil, fmt.Errorf("API %d %s", resp.StatusCode, string(body))
	}
	var rel Release
	if err := json.NewDecoder(resp.Body).Decode(&rel); err != nil {
		return nil, err
	}
	return rel.Assets, nil
}

func probeSequential(base string, preferMp4 bool) []string {
	exts := []string{"mp4", "ts"}
	if !preferMp4 {
		exts = []string{"ts", "mp4"}
	}
	client := &http.Client{Timeout: 8 * time.Second}
	for _, ext := range exts {
		var urls []string
		consecutiveFail := 0
		for i := 0; i < 800; i++ {
			name := fmt.Sprintf("out-%03d.%s", i, ext)
			u := base + name
			req, _ := http.NewRequest("GET", u, nil)
			req.Header.Set("Range", "bytes=0-0")
			resp, err := client.Do(req)
			if err == nil {
				if resp.StatusCode == 206 || resp.StatusCode == 200 {
					urls = append(urls, u)
					consecutiveFail = 0
				} else if len(urls) > 0 {
					consecutiveFail++
				}
				resp.Body.Close()
			} else if len(urls) > 0 {
				consecutiveFail++
			}
			if len(urls) > 0 && consecutiveFail >= 10 {
				break
			}
			if len(urls) == 0 && i > 80 {
				break
			}
		}
		if len(urls) > 0 {
			return urls
		}
	}
	return nil
}

func parseMvhdDuration(data []byte) (float64, bool) {
	if len(data) < 32 {
		return 0, false
	}
	for offset := 0; offset+8 <= len(data); {
		size := binary.BigEndian.Uint32(data[offset:])
		if size < 8 || int(size) > len(data)-offset {
			break
		}
		typ := string(data[offset+4 : offset+8])
		if typ == "moov" {
			inner := offset + 8
			moovEnd := offset + int(size)
			if moovEnd > len(data) {
				moovEnd = len(data)
			}
			for inner+8 <= moovEnd {
				iSize := binary.BigEndian.Uint32(data[inner:])
				if iSize < 8 || int(iSize) > moovEnd-inner {
					break
				}
				iTyp := string(data[inner+4 : inner+8])
				if iTyp == "mvhd" {
					version := data[inner+8]
					if version == 1 {
						if inner+40 > len(data) {
							break
						}
						timescale := binary.BigEndian.Uint32(data[inner+28:])
						durHigh := binary.BigEndian.Uint32(data[inner+32:])
						durLow := binary.BigEndian.Uint32(data[inner+36:])
						duration := float64(durHigh)*4294967296 + float64(durLow)
						if timescale > 0 && duration > 0 {
							return duration / float64(timescale), true
						}
					} else {
						timescale := binary.BigEndian.Uint32(data[inner+20:])
						duration := binary.BigEndian.Uint32(data[inner+24:])
						if timescale > 0 && duration > 0 {
							return float64(duration) / float64(timescale), true
						}
					}
				}
				inner += int(iSize)
			}
		}
		offset += int(size)
	}
	return 0, false
}

// Range 128KB/512KBだけ取得してmoov/mvhdからdurationを取得、失敗時は0を返す（フォールバック無し）
func getDurationFast(client *http.Client, urlStr string) float64 {
	// 1) fast moov/mvhd probe for mp4
	req, _ := http.NewRequest("GET", urlStr, nil)
	req.Header.Set("Range", "bytes=0-131071")
	resp, err := client.Do(req)
	if err == nil {
		if resp.StatusCode == 206 || resp.StatusCode == 200 {
			buf, _ := io.ReadAll(io.LimitReader(resp.Body, 200*1024))
			if d, ok := parseMvhdDuration(buf); ok && d > 0 && d < 100000 {
				resp.Body.Close()
				return d
			}
		}
		resp.Body.Close()
		req2, _ := http.NewRequest("GET", urlStr, nil)
		req2.Header.Set("Range", "bytes=0-524287")
		resp2, err := client.Do(req2)
		if err == nil {
			defer resp2.Body.Close()
			buf2, _ := io.ReadAll(io.LimitReader(resp2.Body, 600*1024))
			if d, ok := parseMvhdDuration(buf2); ok && d > 0 {
				return d
			}
		}
	}
	// 2) ffprobe fallback for .ts and fragmented mp4
	cmd := exec.Command("ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", urlStr)
	out, err := cmd.Output()
	if err == nil {
		var d float64
		fmt.Sscanf(strings.TrimSpace(string(out)), "%f", &d)
		if d > 0 && d < 100000 {
			return d
		}
	}
	return 0
}

func generateM3U(releaseURL, output, token string, concurrency int, preferMp4 bool) error {
	owner, repo, tag, base, err := parseURL(releaseURL)
	if err != nil {
		return err
	}
	fmt.Printf("\n=== %s/%s tag=%s ===\n", owner, repo, tag)

	var urls []string
	assets, err := fetchAssets(owner, repo, tag, token)
	if err != nil {
		fmt.Printf("API失敗 %v -> 探索フォールバック\n", err)
		urls = probeSequential(base, preferMp4)
	} else {
		var media []Asset
		for _, a := range assets {
			ln := strings.ToLower(a.Name)
			if strings.HasSuffix(ln, ".mp4") || strings.HasSuffix(ln, ".ts") || strings.HasSuffix(ln, ".m4s") {
				media = append(media, a)
			}
		}
		sort.Slice(media, func(i, j int) bool { return media[i].Name < media[j].Name })
		if len(media) == 0 {
			urls = probeSequential(base, preferMp4)
		} else {
			for _, m := range media {
				urls = append(urls, m.BrowserDownloadURL)
			}
		}
	}

	if len(urls) == 0 {
		return fmt.Errorf("ファイルが見つかりません")
	}
	fmt.Printf("発見 %d件\n", len(urls))

	durations := make([]float64, len(urls))
	client := &http.Client{Timeout: 10 * time.Second}
	var wg sync.WaitGroup
	sem := make(chan struct{}, concurrency)
	if concurrency <= 0 {
		concurrency = 20
		sem = make(chan struct{}, 20)
	}
	for i, u := range urls {
		wg.Add(1)
		go func(idx int, urlStr string) {
			defer wg.Done()
			sem <- struct{}{}
			defer func() { <-sem }()
			d := getDurationFast(client, urlStr)
			durations[idx] = d
			if d > 0 {
				fmt.Printf("  [%03d] %.3fs\n", idx, d)
			} else {
				fmt.Printf("  [%03d] プローブ失敗 (0s) %s\n", idx, urlStr)
			}
		}(i, u)
	}
	wg.Wait()

	total := 0.0
	maxDur := 0.0
	successCount := 0
	for _, d := range durations {
		if d > 0 {
			total += d
			successCount++
			if d > maxDur {
				maxDur = d
			}
		}
	}
	if successCount == 0 {
		return fmt.Errorf("全ファイルのdurationプローブに失敗しました。ファイルが存在するか、CORSが許可されているか確認してください")
	}
	// TARGETDURATIONは自動検出: 最大セグメントの切り上げ+1で固定
	targetInt := int(maxDur + 1.5)
	if targetInt < 1 {
		targetInt = 1
	}

	isFmp4 := strings.HasSuffix(strings.ToLower(urls[0]), ".mp4")
	version := 3
	if isFmp4 {
		version = 7
	}

	var sb strings.Builder
	sb.WriteString("#EXTM3U\n")
	sb.WriteString(fmt.Sprintf("#EXT-X-VERSION:%d\n", version))
	sb.WriteString("#EXT-X-PLAYLIST-TYPE:VOD\n")
	sb.WriteString("#EXT-X-INDEPENDENT-SEGMENTS\n")
	sb.WriteString(fmt.Sprintf("#EXT-X-TARGETDURATION:%d\n", targetInt))
	sb.WriteString("#EXT-X-MEDIA-SEQUENCE:0\n")
	sb.WriteString("#EXT-X-ALLOW-CACHE:YES\n")
	for i, u := range urls {
		if durations[i] <= 0 {
			continue // プローブ失敗したファイルはスキップ（フォールバック無し）
		}
		sb.WriteString(fmt.Sprintf("#EXTINF:%.3f,\n%s\n", durations[i], u))
	}
	sb.WriteString("#EXT-X-ENDLIST\n")

	if err := os.WriteFile(output, []byte(sb.String()), 0644); err != nil {
		return err
	}
	fmt.Printf("生成完了: %s 合計 %.1fs (%.1f分) %d/%d件成功\n", output, total, total/60, successCount, len(urls))
	return nil
}

func main() {
	urlFlag := flag.String("url", "", "単一Release URL")
	outFlag := flag.String("o", "playlist.m3u8", "出力ファイル (単一URL時のみ)")
	configFlag := flag.String("config", "", "yml設定ファイル (config.yml)")
	tokenFlag := flag.String("token", os.Getenv("GITHUB_TOKEN"), "GitHub Token (環境変数 GITHUB_TOKEN でも可)")
	concurrency := flag.Int("c", 20, "並列数")
	flag.Parse()

	if *configFlag != "" {
		data, err := os.ReadFile(*configFlag)
		if err != nil {
			fmt.Fprintln(os.Stderr, err)
			os.Exit(1)
		}
		var cfg Config
		if err := yaml.Unmarshal(data, &cfg); err != nil {
			fmt.Fprintln(os.Stderr, err)
			os.Exit(1)
		}
		if cfg.Settings.Concurrency == 0 {
			cfg.Settings.Concurrency = 20
		}
		for _, rel := range cfg.Releases {
			if rel.URL == "" {
				continue
			}
			out := rel.Output
			if out == "" {
				out = "playlist.m3u8"
			}
			if err := generateM3U(rel.URL, out, *tokenFlag, cfg.Settings.Concurrency, cfg.Settings.PreferMp4); err != nil {
				fmt.Fprintf(os.Stderr, "失敗 %s: %v\n", rel.URL, err)
			}
		}
		return
	}

	if *urlFlag == "" {
		fmt.Println("使い方:")
		fmt.Println("  単一: go run . -url https://github.com/OWNER/REPO/releases/tag/TAG -o playlist.m3u8")
		fmt.Println("  yml : go run . -config config.yml")
		flag.PrintDefaults()
		os.Exit(1)
	}
	if err := generateM3U(*urlFlag, *outFlag, *tokenFlag, *concurrency, true); err != nil {
		fmt.Fprintln(os.Stderr, err)
		os.Exit(1)
	}
}

          GOMAIN
          echo "Created files:"
          ls -lh
          cat go.mod

      - name: Generate m3u8 with Go (auto TARGETDURATION, no fallback)
        env:
          INPUT_URL: ${ inputs.release_url }
          INPUT_OUTPUT: ${ inputs.output_name }
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }
          DEFAULT_RELEASE: "https://github.com/uefn1/go-stream-capturer/releases/tag/rec-FIFA%2B-20261026-2137"
        run: |
          set -e
          URL="${ inputs.release_url }"
          if [ -z "$URL" ]; then
            URL="${ env.DEFAULT_RELEASE }"
            echo "Using DEFAULT_RELEASE: $URL"
          fi
          OUT="${ inputs.output_name }"
          if [ -z "$OUT" ]; then
            OUT="playlist.m3u8"
          fi
          echo "Release URL: $URL"
          echo "Output: $OUT"
          # install yaml dep
          go mod tidy
          go run . -url "$URL" -o "$OUT"
          echo "=== Generated ==="
          cat "$OUT" || echo "no file"
          ls -lh *.m3u8

      - name: Upload m3u8 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-playlists
          path: "*.m3u8"
          if-no-files-found: warn

      - name: Upload to Release (on release)
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }
        run: |
          for f in *.m3u8; do
            if [ -f "$f" ]; then
              gh release upload "${ github.event.release.tag_name }" "$f" --clobber || echo "upload failed $f"
            fi
          done
