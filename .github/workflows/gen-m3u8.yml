name: Generate m3u8 from Release
on:
  workflow_dispatch:
    inputs:
      release_url:
        description: 'Release Tag URL'
        required: true
        type: string
      output_name:
        description: '出力ファイル名'
        required: false
        default: 'playlist.m3u8'
        type: string
  push:
    branches: [main]
    paths: [config.yml, main.go, go.mod]
  release:
    types: [published]
